<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopEasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body>

<header>
  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="logo"><i class="fas fa-store"></i> ShopEasy</a>
      <button class="hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="/products.html">Products</a>
        <button class="cart-link-btn" onclick="openCartDrawer()" aria-label="Open cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </nav>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to your ShopEasy account</p>

    <div class="alert alert-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> Log In
      </button>
    </form>

    <div style="margin-top:1rem;padding:0.75rem;background:var(--bg);border-radius:8px;font-size:0.82rem;color:var(--text-muted);">
      <strong>Demo accounts:</strong><br>
      Admin: admin@store.com / admin123<br>
      User: user@store.com / user123
    </div>

    <div class="auth-footer">
      Don&rsquo;t have an account? <a href="/register.html">Register free</a>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>
<script src="/js/main.js"></script>
<script>
  // Redirect if already logged in
  if (getUser()) window.location.href = '/index.html';

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.className = 'alert alert-error';

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

    try {
      const { token, user } = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });
      setAuth(token, user);
      const redirect = new URLSearchParams(window.location.search).get('redirect');
      window.location.href = redirect || '/index.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.className = 'alert alert-error show';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In';
    }
  });
</script>
</body>
</html>
