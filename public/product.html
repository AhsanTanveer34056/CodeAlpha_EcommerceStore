<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — ShopEasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body>

<header>
  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="logo"><i class="fas fa-store"></i> ShopEasy</a>
      <button class="hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="/products.html">Products</a>
        <div id="auth-links" style="display:flex;gap:0.75rem;align-items:center;">
          <a href="/login.html">Login</a>
          <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
        <div id="user-links" style="display:none;gap:0.75rem;align-items:center;">
          <a href="/orders.html"><i class="fas fa-box"></i> Orders</a>
          <span id="user-name" class="user-name-nav"></span>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        <button class="cart-link-btn" onclick="openCartDrawer()" aria-label="Open cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </nav>
</header>

<main class="container">
  <div class="breadcrumb">
    <a href="/index.html">Home</a><span>/</span>
    <a href="/products.html">Products</a><span>/</span>
    <span id="bc-name">Loading...</span>
  </div>

  <div id="product-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <section class="section">
    <h2 class="section-title" style="margin-bottom:1.5rem;">More Products</h2>
    <div class="products-grid" id="related-grid"></div>
  </section>
</main>

<footer>
  <div class="container">
    <p>&copy; 2024 ShopEasy. All rights reserved.</p>
    <div class="footer-links">
      <a href="/products.html">Products</a>
      <a href="/orders.html">My Orders</a>
      <a href="/cart.html">Cart</a>
    </div>
  </div>
</footer>

<div id="toast" class="toast"></div>
<script src="/js/main.js"></script>
<script>
  let currentProduct = null;

  async function loadProduct() {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { window.location.href = '/products.html'; return; }

    try {
      currentProduct = await apiFetch('/products/' + id);
      renderProduct(currentProduct);
      document.title = currentProduct.name + ' — ShopEasy';
      document.getElementById('bc-name').textContent = currentProduct.name;
      loadRelated(currentProduct.category, currentProduct.id);
    } catch {
      document.getElementById('product-container').innerHTML = `
        <div class="empty-state">
          <div class="icon">😕</div>
          <h3>Product not found</h3>
          <a href="/products.html" class="btn btn-primary">Back to Products</a>
        </div>`;
    }
  }

  function renderProduct(p) {
    const stock = parseInt(p.stock);
    let stockHtml;
    if (stock === 0) stockHtml = '<span class="detail-stock stock-out"><i class="fas fa-times-circle"></i> Out of Stock</span>';
    else if (stock < 10) stockHtml = `<span class="detail-stock stock-low"><i class="fas fa-exclamation-triangle"></i> Only ${stock} left</span>`;
    else stockHtml = `<span class="detail-stock stock-ok"><i class="fas fa-check-circle"></i> In Stock (${stock} available)</span>`;

    document.getElementById('product-container').innerHTML = `
      <div class="product-detail">
        <div class="product-detail-image">
          <img src="${p.image || 'https://placehold.co/600x450/e5e7eb/6b7280?text=No+Image'}" alt="${escHtml(p.name)}">
        </div>
        <div class="product-detail-info">
          <span class="detail-category">${escHtml(p.category)}</span>
          <h1 class="detail-title">${escHtml(p.name)}</h1>
          <div class="detail-price">${fmt(p.price)}</div>
          <p class="detail-desc">${escHtml(p.description)}</p>
          ${stockHtml}
          <div class="quantity-row">
            <label>Quantity:</label>
            <div class="qty-input-group">
              <button onclick="changeQty(-1)">−</button>
              <input type="number" id="qty-input" value="1" min="1" max="${stock}">
              <button onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <button class="btn btn-primary" style="flex:1;min-width:160px;" ${stock === 0 ? 'disabled' : ''} onclick="handleAddToCart()">
              <i class="fas fa-shopping-cart"></i> Add to Cart
            </button>
            <a href="/cart.html" class="btn btn-outline" style="flex:1;min-width:160px;">
              <i class="fas fa-eye"></i> View Cart
            </a>
          </div>
        </div>
      </div>`;
  }

  function changeQty(delta) {
    const input = document.getElementById('qty-input');
    const newVal = Math.max(1, Math.min(parseInt(currentProduct.stock), (parseInt(input.value) || 1) + delta));
    input.value = newVal;
  }

  function handleAddToCart() {
    const qty = parseInt(document.getElementById('qty-input').value) || 1;
    addToCart(currentProduct, qty);
  }

  async function loadRelated(category, excludeId) {
    try {
      const { products } = await apiFetch(`/products?category=${encodeURIComponent(category)}&limit=4`);
      const filtered = products.filter(p => p.id !== parseInt(excludeId));
      const grid = document.getElementById('related-grid');
      grid.innerHTML = filtered.length ? filtered.slice(0,4).map(renderProductCard).join('') : '';
    } catch {}
  }

  document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
